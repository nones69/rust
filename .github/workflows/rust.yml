name: Rust

on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
      - "rust-toolchain.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Release build + smoke demos
        run: |
          cargo build --release -p intentos -p ransomware-demo -p ikrl-sim
          cargo run -p ikrl-sim --release
          cargo run -p ransomware-demo --release -- --target-dir demo_victim_ci
          cargo run -p intentos --release -- -c "status"
