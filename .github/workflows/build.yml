name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Build intentos
        run: cargo build -p intentos --release
      - name: Test ground_up
        run: cargo test -p intentos --test ground_up