name: ISO Build Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

env:
  ISO_NAME: custom-os
  UBUNTU_RELEASE: noble

jobs:
  build-iso:
    name: Build All-In-One ISO
    runs-on: ubuntu-24.04    # Must be Ubuntu to use live-build
    timeout-minutes: 120

    permissions:
      contents: write       # Required for release artifact upload

    steps:
      # ── Step 1: Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Step 2: Install host tools ─────────────────────────────────────────
      - name: Install host prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git xorriso squashfs-tools genisoimage \
            debootstrap live-build \
            grub-efi-amd64-bin grub-pc-bin grub-common grub2-common \
            syslinux syslinux-efi isolinux \
            qemu-system-x86 ovmf binutils parted gdisk \
            gcc-multilib python3 python3-pip ca-certificates
          make --version

      # ── Step 3: Cache Rust toolchain ───────────────────────────────────────
      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: rust-${{ runner.os }}-${{ hashFiles('rust-os/rust-toolchain.toml') }}

      # ── Step 4: Install Rust ───────────────────────────────────────────────
      - name: Install Rust nightly toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
            --default-toolchain nightly \
            --component rust-src llvm-tools-preview \
            --target x86_64-unknown-none \
            -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show

      # ── Step 5: Cache live-build APT packages ──────────────────────────────
      - name: Cache live-build APT packages
        uses: actions/cache@v4
        with:
          path: ubuntu-live/.cache/
          key: lb-cache-${{ env.UBUNTU_RELEASE }}-${{ hashFiles('ubuntu-live/config/package-lists/*.list.chroot') }}
          restore-keys: lb-cache-${{ env.UBUNTU_RELEASE }}-

      # ── Step 6: Build Rust OS kernel ──────────────────────────────────────
      - name: Build Rust OS kernel (Module 1)
        run: make rust-os

      # ── Step 7: Build Ubuntu live layer ───────────────────────────────────
      - name: Build Ubuntu live layer (Module 2)
        run: make ubuntu-live
        env:
          DEBIAN_FRONTEND: noninteractive

      # ── Step 8: Build bootloader ───────────────────────────────────────────
      - name: Build bootloader (Module 3)
        run: make bootloader

      # ── Step 9: Assemble final ISO ────────────────────────────────────────
      - name: Assemble final ISO (Module 4)
        run: make iso

      # ── Step 10: Verify ISO ───────────────────────────────────────────────
      - name: Verify ISO integrity
        run: make verify

      # ── Step 11: Upload ISO as artifact ───────────────────────────────────
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso-${{ github.sha }}
          path: |
            dist/custom-os.iso
            dist/custom-os.iso.sha256
          retention-days: 30

      # ── Step 12: Publish to GitHub Releases (tags only) ───────────────────
      - name: Publish to GitHub Releases
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/custom-os.iso \
            dist/custom-os.iso.sha256 \
            --clobber
