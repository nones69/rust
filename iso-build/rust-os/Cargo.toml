[package]
name        = "rust-os"
version     = "0.1.0"
edition     = "2021"
authors     = ["Dan <dan@example.com>"]
description = "Bare-metal x86_64 OS kernel — All-In-One ISO Build System"
license     = "MIT"

[[bin]]
name = "rust-os"
path = "src/main.rs"

[dependencies]
spin       = "0.9"
x86_64     = "0.14"
uart_16550 = "0.3"
lazy_static = { version = "1.5", features = ["spin_no_std"] }

[profile.dev]
opt-level = 0
panic     = "abort"

[profile.release]
opt-level       = "s"
panic           = "abort"
lto             = true
codegen-units   = 1
debug           = false
strip           = "symbols"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]