# ── All-In-One ISO Build System — ISOLINUX Configuration ────────────────────────
# BIOS-mode fallback bootloader for CD/DVD El Torito boot.
# Dan — v1.0.0 — July 2026
# ──────────────────────────────────────────────────────────────────────────────

# Use the VGA graphical menu module
UI vesamenu.c32

# ── Appearance ────────────────────────────────────────────────────────────────
MENU TITLE  All-In-One ISO Build System — Custom OS 2026
MENU BACKGROUND /boot/isolinux/background.png
MENU COLOR  title      1;37;40  #ffffffff #00000000 std
MENU COLOR  sel        7;37;40  #ffffffff #2b579700 std
MENU COLOR  unsel      37;40    #cccccccc #00000000 std
MENU COLOR  border     30;40    #00000000 #00000000 none
MENU COLOR  scrollbar  30;40    #00000000 #00000000 none
MENU COLOR  tabmsg     31;40    #ff9900ff #00000000 none
MENU COLOR  cmdmark    1;36;40  #00000000 #00000000 none
MENU COLOR  cmdline    37;40    #ffffffff #00000000 std
MENU COLOR  pwdborder  30;47    #7fa7d931 #00000000 std
MENU COLOR  pwdheader  31;47    #08b8ffff #00000000 std
MENU COLOR  pwdentry   30;47    #f1f1f1ff #00000000 std
MENU COLOR  timeout_msg 37;40  #ffffffff #00000000 none
MENU COLOR  timeout    1;37;40  #ffffffff #00000000 none
MENU COLOR  help       37;40    #cccccccc #00000000 std
MENU VSHIFT 8
MENU ROWS 10

# ── Timeout ───────────────────────────────────────────────────────────────────
TIMEOUT 100      # 10 seconds (units: 1/10 sec)
DEFAULT live

# ══════════════════════════════════════════════════════════════════════════════
LABEL live
    MENU LABEL Custom OS ^— Live Session (Ubuntu 24.04 Noble)
    MENU DEFAULT
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd boot=live components quiet splash \
           hostname=custom-os username=liveuser locale=en_US.UTF-8 \
           console=tty0 console=ttyS0,115200n8

LABEL rustos
    MENU LABEL Rust OS Kernel ^— Bare Metal (x86_64 no_std)
    KERNEL /boot/rust-os.elf

LABEL toram
    MENU LABEL Custom OS — Live (^Run From RAM / toram)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd boot=live components toram quiet \
           hostname=custom-os username=liveuser locale=en_US.UTF-8

LABEL safegfx
    MENU LABEL Custom OS — Live (^Safe Graphics / nomodeset)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd boot=live components nomodeset quiet \
           hostname=custom-os username=liveuser locale=en_US.UTF-8

LABEL memtest
    MENU LABEL ^Memory Test (memtest86+)
    KERNEL /boot/memtest86+.bin

LABEL hdd
    MENU LABEL Boot from ^Hard Disk
    LOCALBOOT 0x80
