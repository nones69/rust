# SYSLINUX configuration — USB/HDD BIOS boot (mirrors isolinux.cfg)
DEFAULT live
TIMEOUT 100
PROMPT 0

UI vesamenu.c32
MENU TITLE Custom OS 2026 — USB Boot Menu

LABEL live
    MENU LABEL Custom OS ^— Live Session (Ubuntu 24.04 Noble)
    MENU DEFAULT
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd boot=live components quiet splash \
           hostname=custom-os username=liveuser locale=en_US.UTF-8 \
           console=tty0 console=ttyS0,115200n8

LABEL rustos
    MENU LABEL Rust OS Kernel ^— Bare Metal (x86_64 no_std)
    KERNEL /boot/rust-os.elf

LABEL toram
    MENU LABEL Custom OS — Live (^Run From RAM / toram)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd boot=live components toram quiet \
           hostname=custom-os username=liveuser locale=en_US.UTF-8

LABEL safegfx
    MENU LABEL Custom OS — Live (^Safe Graphics / nomodeset)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd boot=live components nomodeset quiet \
           hostname=custom-os username=liveuser locale=en_US.UTF-8

LABEL install
    MENU LABEL ^Install Custom OS to Disk
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd boot=live components only-ubiquity quiet splash \
           hostname=custom-os username=liveuser locale=en_US.UTF-8 \
           console=tty0 console=ttyS0,115200n8

LABEL upgrade
    MENU LABEL ^Upgrade Existing IntentOS Installation
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd boot=live components intentos-upgrade quiet splash \
           hostname=custom-os username=liveuser locale=en_US.UTF-8 \
           console=tty0 console=ttyS0,115200n8

LABEL vmware
    MENU LABEL Custom OS — ^VMware Optimized Live Session
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd boot=live components quiet \
           hostname=custom-os username=liveuser locale=en_US.UTF-8 \
           vmwgfx.enable_fbdev=1 video=1024x768 noprompt

LABEL hdd
    MENU LABEL Boot from ^Hard Disk
    LOCALBOOT 0x80