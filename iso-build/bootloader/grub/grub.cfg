# ── All-In-One ISO Build System — GRUB2 Configuration ───────────────────────────
# Supports: BIOS (via grub-pc) and UEFI (via grub-efi-amd64)
# Dan — v1.0.0 — July 2026
# ──────────────────────────────────────────────────────────────────────────────

# ── Display Settings ──────────────────────────────────────────────────────────
set gfxmode=1280x720,1024x768,auto
set gfxpayload=keep
insmod gfxterm
insmod vbe
insmod vga
insmod png
terminal_output gfxterm

# ── Theme ─────────────────────────────────────────────────────────────────────
# Load the custom theme from the ISO boot partition
if [ -f /boot/grub/themes/custom/theme.txt ]; then
    set theme=/boot/grub/themes/custom/theme.txt
    export theme
fi

# ── Default Boot Selection & Timeout ─────────────────────────────────────────
set default=0
set timeout=10
set timeout_style=menu

# ── Locale ────────────────────────────────────────────────────────────────────
set lang=en_US
set locale_dir=/boot/grub/locale

# ── Colour Theme (fallback if graphical theme fails) ─────────────────────────
set color_normal=white/black
set color_highlight=black/light-cyan
set menu_color_normal=white/black
set menu_color_highlight=black/light-blue

# ══════════════════════════════════════════════════════════════════════════════
# MENU ENTRY 0 — Custom OS Live (Ubuntu 24.04 / default boot)
# ══════════════════════════════════════════════════════════════════════════════
menuentry "Custom OS — Live Session (Ubuntu 24.04 Noble)" --class ubuntu --class gnu-linux --class gnu --class os {
    recordfail
    load_video
    insmod gzio
    insmod part_gpt
    insmod part_msdos
    insmod iso9660
    insmod ext2

    # Locate the boot device automatically
    search --no-floppy --set=root --label "CUSTOM_OS_2026"

    echo "Loading kernel ..."
    linux  /live/vmlinuz \
        boot=live \
        components \
        quiet \
        splash \
        hostname=custom-os \
        username=liveuser \
        locale=en_US.UTF-8 \
        timezone=UTC \
        console=tty0 \
        console=ttyS0,115200n8

    echo "Loading initial RAM disk ..."
    initrd /live/initrd

    echo "Booting Custom OS ..."
}

# ══════════════════════════════════════════════════════════════════════════════
# MENU ENTRY 1 — Rust OS Kernel (Bare Metal)
# ══════════════════════════════════════════════════════════════════════════════
menuentry "Rust OS Kernel — Bare Metal (x86_64 no_std)" --class rust --class os {
    recordfail
    load_video
    insmod gzio
    insmod part_gpt
    insmod part_msdos
    insmod iso9660
    insmod multiboot2

    search --no-floppy --set=root --label "CUSTOM_OS_2026"

    echo "Loading Rust OS kernel (ELF, multiboot2) ..."
    multiboot2 /boot/rust-os.elf

    echo "Booting Rust OS ..."
    boot
}

# ══════════════════════════════════════════════════════════════════════════════
# MENU ENTRY 2 — Ubuntu Live (RAM — copy to RAM for faster operation)
