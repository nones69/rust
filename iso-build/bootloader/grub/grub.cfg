# ══════════════════════════════════════════════════════════════════════════════
# MENU ENTRY 5 — Upgrade Existing IntentOS Installation
# ══════════════════════════════════════════════════════════════════════════════
menuentry "Custom OS — Upgrade Existing IntentOS Installation" --class ubuntu --class gnu-linux --class os {
    recordfail
    load_video
    insmod gzio
    insmod part_gpt
    insmod part_msdos
    insmod iso9660
    insmod ext2

    search --no-floppy --set=root --label "CUSTOM_OS_2026"

    echo "Loading upgrade kernel ..."
    # intentos-upgrade: custom live-session hook parameter — the live overlay
    # detects this on /proc/cmdline and automatically runs install/linux/upgrade.sh
    linux  /live/vmlinuz \
        boot=live \
        components \
        intentos-upgrade \
        quiet \
        splash \
        hostname=custom-os \
        username=liveuser \
        locale=en_US.UTF-8 \
        timezone=UTC \
        console=tty0 \
        console=ttyS0,115200n8

    echo "Loading initial RAM disk ..."
    initrd /live/initrd

    echo "Starting upgrade ..."
}

# ══════════════════════════════════════════════════════════════════════════════
# MENU ENTRY 6 — VMware Optimized Live Session
# ══════════════════════════════════════════════════════════════════════════════
menuentry "Custom OS — VMware Optimized Live Session" --class ubuntu --class os {
    recordfail
    load_video
    insmod gzio
    insmod part_gpt
    insmod iso9660

    search --no-floppy --set=root --label "CUSTOM_OS_2026"

    echo "Loading kernel (VMware mode) ..."
    linux  /live/vmlinuz \
        boot=live \
        components \
        quiet \
        hostname=custom-os \
        username=liveuser \
        locale=en_US.UTF-8 \
        timezone=UTC \
        console=tty0 \
        vmwgfx.enable_fbdev=1 \
        video=1024x768 \
        noprompt

    echo "Loading initrd ..."
    initrd /live/initrd

    echo "Booting in VMware mode ..."
}

# ══════════════════════════════════════════════════════════════════════════════
# MENU ENTRY 7 — Memory Test (memtest86+)
# ══════════════════════════════════════════════════════════════════════════════
menuentry "Memory Test (memtest86+)" --class memtest --class tool {
    load_video
    insmod part_gpt
    insmod part_msdos
    insmod iso9660

    search --no-floppy --set=root --label "CUSTOM_OS_2026"

    echo "Loading memtest86+ ..."
    linux16 /boot/memtest86+.bin
}
