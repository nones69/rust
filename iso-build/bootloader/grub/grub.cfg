# ══════════════════════════════════════════════════════════════════════════════
# MENU ENTRY 4 — Install to Disk (Calamares / Ubiquity installer)
# ══════════════════════════════════════════════════════════════════════════════
menuentry "Install Custom OS to Disk" --class ubuntu --class gnu-linux --class gnu --class os {
