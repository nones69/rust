# Root package intentionally disabled.
#
# The primary Rust prototype is the workspace under `rust/`.
# Bare-metal / live-ISO work lives under `iso-build/` (experimental).
# Quarantined root stubs: `experimental/baremetal-root-stubs/`.
#
# This placeholder prevents `cargo build` at the repo root from picking up an
# incomplete no_std package.

[workspace]
members = []
exclude = ["rust", "iso-build", "tools", "platform"]
resolver = "2"
